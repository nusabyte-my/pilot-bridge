services:
  pilotbridge:
    build: .
    container_name: pilotbridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PILOTBRIDGE_DB: /app/data/pilotbridge.db
    volumes:
      - pilotbridge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
volumes:
  pilotbridge-data:
